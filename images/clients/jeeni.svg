<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%">
  <defs>
    <linearGradient id="jeeniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <!-- Jeeni Natural Grain & Health Leaf Emblem -->
  <g transform="translate(18, 14)">
    <circle cx="26" cy="26" r="25" fill="url(#jeeniGrad)"/>
    <!-- Grain stalks -->
    <path d="M 26 44 C 26 34 26 22 26 12" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Grain leaves left -->
    <ellipse cx="20" cy="20" rx="5" ry="3" transform="rotate(-30 20 20)" fill="#FFD54F"/>
    <ellipse cx="18" cy="28" rx="5" ry="3" transform="rotate(-30 18 28)" fill="#FFD54F"/>
    <ellipse cx="19" cy="36" rx="5" ry="3" transform="rotate(-30 19 36)" fill="#FFD54F"/>
    <!-- Grain leaves right -->
    <ellipse cx="32" cy="18" rx="5" ry="3" transform="rotate(30 32 18)" fill="#FFD54F"/>
    <ellipse cx="34" cy="26" rx="5" ry="3" transform="rotate(30 34 26)" fill="#FFD54F"/>
    <ellipse cx="33" cy="34" rx="5" ry="3" transform="rotate(30 33 34)" fill="#FFD54F"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(80, 0)">
    <text x="0" y="38" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FF4D4D" letter-spacing="2">JEENI</text>
    <text x="0" y="54" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#4ADE80" letter-spacing="1">MILLET HEALTH MIX</text>
    <text x="0" y="67" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#94A3B8" letter-spacing="1.5">NUTRITION FOR LIFE</text>
  </g>
</svg>
