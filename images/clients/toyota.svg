<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%">
  <!-- Toyota Iconic Triple-Oval Emblem -->
  <g transform="translate(18, 14)">
    <!-- Outer oval -->
    <ellipse cx="28" cy="26" rx="26" ry="19" fill="none" stroke="#EB0A1E" stroke-width="4.2"/>
    <!-- Inner vertical oval -->
    <ellipse cx="28" cy="27" rx="10" ry="16.5" fill="none" stroke="#EB0A1E" stroke-width="3.6"/>
    <!-- Inner horizontal top oval -->
    <ellipse cx="28" cy="18" rx="19" ry="7" fill="none" stroke="#EB0A1E" stroke-width="3.6"/>
  </g>
  <!-- Toyota Wordmark -->
  <g transform="translate(86, 0)">
    <text x="0" y="44" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="4">TOYOTA</text>
    <text x="0" y="59" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#94A3B8" letter-spacing="2.5">MOBILITY FOR ALL</text>
  </g>
</svg>
